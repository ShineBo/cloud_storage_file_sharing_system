server {
    listen 8080;
    server_name _;
    server_tokens off;
    # The application limits the file itself. Allow space for multipart framing.
    client_max_body_size 2001000000;

    # Re-resolve service addresses when Compose recreates a container.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        access_log off;
        set $api http://api:3001;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location /shared/ {
        access_log off;
        add_header Referrer-Policy no-referrer always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        set $web http://web:3000;
        proxy_pass $web$request_uri;
        proxy_set_header Host $http_host;
    }

    location / {
        set $web http://web:3000;
        proxy_pass $web$request_uri;
        proxy_set_header Host $http_host;
    }
}
