services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: cloud_storage
      POSTGRES_USER: cloud_storage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env for local development}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cloud_storage", "-d", "cloud_storage"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
