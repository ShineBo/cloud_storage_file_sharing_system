x-database: &database
  PGHOST: db
  PGDATABASE: cloud_storage
  PGUSER: cloud_storage
  PGPASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:configure}

services:
  identity:
    environment:
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3;
          grep -qE "^HTTP/1.[01] 200" <&3'
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    image: se-final-cloud-storage:local
    pull_policy: never
    command: ["node", "scripts/migrate.mjs", "--class-fixtures"]
    environment:
      <<: *database
      OIDC_ISSUER: ${CLASS_IDENTITY_ORIGIN:-http://127.0.0.1:18080}/realms/se-final-class
    depends_on:
      db:
        condition: service_healthy

  api:
    image: se-final-cloud-storage:local
    build: .
    pull_policy: never
    environment:
      <<: *database
      API_HOST: 0.0.0.0
      API_PORT: 3001
      APP_ORIGIN: ${CLASS_APP_ORIGIN:-http://127.0.0.1:3080}
      OIDC_ISSUER: ${CLASS_IDENTITY_ORIGIN:-http://127.0.0.1:18080}/realms/se-final-class
      OIDC_BACKCHANNEL_URL: http://identity:8080
      OIDC_CLIENT_ID: cloud-storage
      OIDC_BROWSER_LOGOUT: "true"
      OIDC_CLIENT_SECRET: ${CLASS_OIDC_CLIENT_SECRET:?Run npm run local:configure}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-plain}
      SMTP_FROM: ${SMTP_FROM:-cloud-storage@example.test}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SECURITY_ALERT_TO: ${SECURITY_ALERT_TO-security-reviewer@example.test}
      SECURITY_ALERT_RULES: ${SECURITY_ALERT_RULES-denied-shared-access,inactive-share-access}
      FILE_STORAGE_PATH: /var/lib/cloud-storage/files
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-2000000000}
      FILE_QUOTA_BYTES: ${FILE_QUOTA_BYTES:-20000000000}
    volumes:
      - file_data:/var/lib/cloud-storage/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/ready').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})
      interval: 4s
      timeout: 4s
      retries: 15

  web:
    image: se-final-cloud-storage:local
    pull_policy: never
    command: ["./node_modules/.bin/next", "start", "apps/web", "--hostname", "0.0.0.0"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})
      interval: 4s
      timeout: 4s
      retries: 15

  proxy:
    image: nginx:1.31.9-alpine
    ports:
      - "127.0.0.1:${CLASS_WEB_PORT:-3080}:8080"
    volumes:
      - type: bind
        source: ./deploy/nginx.local.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  file_data:
